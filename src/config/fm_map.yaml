# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket_trust: ticket overrides DB delay_days (C-101 injection, C-102 false fact)
stale_policy: FM-06            # stale_clause: superseded (SHIP-LATE-OLD) or not-yet-effective (SHIP-LATE-FUTURE) clause
clause_sum: FM-04              # sum_parts: adds clause parts instead of taking the max
double_deduct: FM-05           # pre_deducted: agent subtracts prior refunds the host also subtracts
sibling_refund: FM-07          # sibling_refund: batch refund written under sibling claims
denied_ignored: FM-02          # ignore_denied: host denies (expired approval, already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # misreport: reply states the proposed amount, ledger holds the approval-capped one
cross_principal: FM-09         # cross_principal: acts on / leaks an order owned by another principal
